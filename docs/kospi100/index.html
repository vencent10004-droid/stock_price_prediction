  .note { color: var(--muted); font-size: 12px; margin-bottom: 16px; }

  .bar-track { height: 14px; position: relative; }
  .bar-fill { position: absolute; top: 1px; bottom: 1px; border-radius: 4px; min-width: 2px; }
  .bar-fill.buy  { background: var(--buy); }
  .bar-fill.sell { background: var(--sell); }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  tbody td {

    white-space: nowrap; font-variant-numeric: tabular-nums;

    text-align: left; border-right: 1px solid var(--grid); max-width: 200px;

const state = { met: "v", search: "", sortKey: "rank", sortDir: 1, day: null, mkt: "ALL" };
DATA.stocks.forEach((s, i) => { s.gi = i; });
function visible() { return state.mkt === "ALL" ? DATA.stocks : DATA.stocks.filter(s => s.market === state.mkt); }
function badge(st) { return st.market === "KOSDAQ" ? '<span class="mk">KQ</span>' : ""; }
function naverUrl(st) { return `https://m.stock.naver.com/domestic/stock/${st.code}/total`; }
const WD = ["일","월","화","수","목","금","토"];
const INV = [{ k: "f", name: "외국인", short: "외국인" }, { k: "o", name: "기관", short: "기관" }];
const mqMobile = matchMedia("(max-width: 768px)");

function fdate(bd, withWd) {
  const y = +bd.slice(0,4), m = +bd.slice(4,6), d = +bd.slice(6,8);
  const s = String(m).padStart(2,"0") + "/" + String(d).padStart(2,"0");
  return withWd ? s + "(" + WD[new Date(y, m-1, d).getDay()] + ")" : s;
}
function comma(n) { return (Math.round(n) || 0).toLocaleString("ko-KR"); }
function cellVal(st, bd, inv) {
  const d = st.days[bd];
  if (!d) return null;
  if (state.met === "c") return d.chg ?? null;   // 등락률(%) — 투자자 구분 없음
  return d[inv + state.met];          // fv | fq | ov | oq
}
function sumOf(st, inv) {
  if (state.met === "c") {            // 기간 누적 수익률 (%)
    let p = 1, has = false;
    for (const bd of DATA.dates) { const d = st.days[bd]; if (d && d.chg != null) { p *= 1 + d.chg / 100; has = true; } }
    return has ? (p - 1) * 100 : null;
  }
  let s = 0, has = false;
  for (const bd of DATA.dates) { const v = cellVal(st, bd, inv); if (v !== null) { s += v; has = true; } }
  return has ? s : null;
}
function fmtVal(v) { return state.met === "c" ? (v > 0 ? "+" : "") + v.toFixed(2) : comma(v); }

/* ---------- 헤더/메타 ---------- */
document.getElementById("period").textContent =

document.getElementById("updated").textContent =

/* ---------- 요약 타일 ---------- */
function renderTiles() {
  const vis = visible();
  const last = DATA.dates[DATA.dates.length - 1];
  const mk = (inv, bd) => {
    let s = 0;
    for (const st of vis) { const d = st.days[bd]; if (d) s += d[inv + "v"]; }
    return s;
  };
  const cum = inv => {
    let s = 0;
    for (const st of vis) for (const bd of DATA.dates) { const d = st.days[bd]; if (d) s += d[inv + "v"]; }
    return s;
  };
  const tile = (label, v, sub) => `
    <div class="tile">
      <div class="label">${label}</div>
      <div class="value"><span class="dir ${v >= 0 ? "up" : "down"}"></span>${comma(v)} <span style="font-size:13px;font-weight:400;color:var(--muted)">억원</span></div>
      <div class="sub">${sub}</div>
    </div>`;
  const lastLabel = fdate(last, true);
  const scope = `${vis.length}종목 합계 (추정)`;
  document.getElementById("tiles").innerHTML =
    tile("외국인 순매매 · 최근 거래일", mk("f", last), lastLabel + " · " + scope) +
    tile("기관 순매매 · 최근 거래일",   mk("o", last), lastLabel + " · " + scope) +
    tile("외국인 순매매 · 2주 누적",    cum("f"), "기간 전체 · " + scope) +
    tile("기관 순매매 · 2주 누적",      cum("o"), "기간 전체 · " + scope);
}

/* ---------- 상위/하위 5 (외국인·기관 각각) ---------- */
function renderRank() {
  let html = "";
  let maxAbs = 1;
  const byInv = {};
  for (const { k } of INV) {
    const rows = visible().map(st => {
      let s = 0;
      for (const bd of DATA.dates) { const d = st.days[bd]; if (d) s += d[k + "v"]; }
      return { name: st.name, mk: badge(st), v: s };
    }).sort((a, b) => b.v - a.v);
    byInv[k] = rows;
    maxAbs = Math.max(maxAbs, ...rows.map(r => Math.abs(r.v)));
  }
  const bar = (r, cls) => `
    <div class="bar-row">
      <div class="nm" title="${r.name}">${r.name}${r.mk}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="left:0;width:${Math.max(2, Math.abs(r.v) / maxAbs * 100)}%"></div></div>
      <div class="val">${comma(r.v)} 억</div>
    </div>`;
  for (const { k, name } of INV) {
    const rows = byInv[k];
    const buys = rows.slice(0, 5).filter(r => r.v > 0);
    const sells = rows.slice(-5).filter(r => r.v < 0).sort((a, b) => a.v - b.v);
    html += `<div class="rankcard"><h2>${name} 2주 누적 순매수 상위 5</h2>${buys.map(r => bar(r, "buy")).join("") || '<span style="color:var(--muted)">해당 없음</span>'}</div>`;
    html += `<div class="rankcard"><h2>${name} 2주 누적 순매도 상위 5</h2>${sells.map(r => bar(r, "sell")).join("") || '<span style="color:var(--muted)">해당 없음</span>'}</div>`;
  }
  document.getElementById("rankrow").innerHTML = html;
}

/* ---------- 테이블 ---------- */
function heatMax() {
  const vals = [];
  for (const st of visible())
    for (const bd of DATA.dates) {
      if (state.met === "c") { const v = cellVal(st, bd, "f"); if (v) vals.push(Math.abs(v)); }
      else for (const { k } of INV) { const v = cellVal(st, bd, k); if (v !== null && v !== 0) vals.push(Math.abs(v)); }
    }
  if (!vals.length) return 1;
  vals.sort((a, b) => a - b);
  return vals[Math.floor(vals.length * 0.95)] || vals[vals.length - 1];
}

function renderTableDesktop() {
  const vmax = heatMax();
  const arrow = k => state.sortKey === k ? ` <span class="arrow">${state.sortDir < 0 ? "▼" : "▲"}</span>` : "";

  // 헤더 1행: 날짜 (colspan 2), 2행: 외국인/기관 — 등락률 모드는 날짜당 1열
  let h1 = `<th class="namecol" rowspan="2" data-k="rank">종목${arrow("rank")}</th>`;
  let h2 = "";
  if (state.met === "c") {
    for (const bd of DATA.dates) h1 += `<th class="grp" rowspan="2" data-k="${bd}_f">${fdate(bd, true)}${arrow(bd + "_f")}</th>`;
    h1 += `<th class="grp" rowspan="2" data-k="sum_f">기간 수익률${arrow("sum_f")}</th>`;
  } else {
    for (const bd of DATA.dates) {
      h1 += `<th colspan="2" class="grp">${fdate(bd, true)}</th>`;
      h2 += `<th class="grp" data-k="${bd}_f">외국인${arrow(bd + "_f")}</th><th data-k="${bd}_o">기관${arrow(bd + "_o")}</th>`;
    }
    h1 += `<th colspan="2" class="grp">2주 합계</th>`;
    h2 += `<th class="grp" data-k="sum_f">외국인${arrow("sum_f")}</th><th data-k="sum_o">기관${arrow("sum_o")}</th>`;
  }
  document.getElementById("headRow1").innerHTML = h1;
  document.getElementById("headRow2").innerHTML = h2;

  // 정렬 + 필터
  const q = state.search.trim().toLowerCase();
  let rows = visible().filter(st => !q || st.name.toLowerCase().includes(q) || st.code.includes(q));
  rows = rows.map(st => ({ st, sumF: sumOf(st, "f"), sumO: sumOf(st, "o") }));
  rows.sort((a, b) => {
    let av, bv;
    if (state.sortKey === "rank") { av = a.st.gi; bv = b.st.gi; }
    else if (state.sortKey === "sum_f") { av = a.sumF ?? -Infinity; bv = b.sumF ?? -Infinity; }
    else if (state.sortKey === "sum_o") { av = a.sumO ?? -Infinity; bv = b.sumO ?? -Infinity; }
    else {
      const [bd, inv] = state.sortKey.split("_");
      av = cellVal(a.st, bd, inv) ?? -Infinity; bv = cellVal(b.st, bd, inv) ?? -Infinity;
    }
    return (av - bv) * state.sortDir;
  });

  // 본문
  const cell = (st, bd, inv, cls) => {
    const v = cellVal(st, bd, inv);
    if (v === null) return `<td class="empty ${cls}">–</td>`;
    const a = Math.min(1, Math.abs(v) / vmax) * 0.55;
    const bg = v > 0 ? `rgba(var(--buy-rgb),${a.toFixed(3)})` : v < 0 ? `rgba(var(--sell-rgb),${a.toFixed(3)})` : "transparent";
    return `<td class="${cls}" data-c="${st.code}" data-d="${bd}" style="background:${bg}">${fmtVal(v)}</td>`;
  };
  const frag = [];
  for (const { st, sumF, sumO } of rows) {
    let tr = `<tr><td class="namecol"><span class="rk">${st.rank}</span><a href="${naverUrl(st)}" target="_blank" rel="noopener" title="네이버 증권에서 자세히 보기"><b>${st.name}</b></a>${badge(st)}<span class="cd">${st.code}</span></td>`;
    if (state.met === "c") {
      for (const bd of DATA.dates) tr += cell(st, bd, "f", "grp");
      tr += `<td class="sumcol grp">${sumF === null ? "–" : fmtVal(sumF)}</td></tr>`;
    } else {
      for (const bd of DATA.dates) {
        tr += cell(st, bd, "f", "grp");
        tr += cell(st, bd, "o", "");
      }
      tr += `<td class="sumcol grp">${sumF === null ? "–" : fmtVal(sumF)}</td>`;
      tr += `<td class="sumcol">${sumO === null ? "–" : fmtVal(sumO)}</td></tr>`;
    }
    frag.push(tr);
  }
  document.getElementById("body").innerHTML = frag.join("");
}

    else {
      const [bd, inv] = state.sortKey.split("_");
      av = cellVal(a.st, bd, inv) ?? -Infinity; bv = cellVal(b.st, bd, inv) ?? -Infinity;
    }
    return (av - bv) * state.sortDir;
  });

  const cellHtml = (v, cls) => v === null ? `<td class="empty ${cls}">–</td>` : `<td class="${cls}" style="${cellTint(v, vmax)}">${fmtVal(v)}</td>`;
  const frag = [];
  for (const { st, sumF, sumO } of rows) {
    let tr = `<tr class="mrow" data-code="${st.code}"><td class="namecol"><span class="rk">${st.rank}</span><b>${st.name}</b>${badge(st)}</td>`;
    if (state.met === "c") {
      tr += cellHtml(cellVal(st, day, "f"), "grp") + cellHtml(sumF, "grp") + `</tr>`;
    } else {
      tr += cellHtml(cellVal(st, day, "f"), "grp") + cellHtml(cellVal(st, day, "o"), "");
      tr += cellHtml(sumF, "grp") + cellHtml(sumO, "") + `</tr>`;
    }
    frag.push(tr);
  }
  document.getElementById("body").innerHTML = frag.join("");
}

function renderTable() {
  if (mqMobile.matches) renderTableMobile(); else renderTableDesktop();
}

/* ---------- 이벤트 ---------- */
document.getElementById("segMet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of b.parentElement.children) x.classList.remove("on");
  b.classList.add("on");
  state.met = b.dataset.v;
  renderTable();
});

document.getElementById("segMkt").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of b.parentElement.children) x.classList.remove("on");
  b.classList.add("on");
  state.mkt = b.dataset.v;
  renderTiles(); renderRank(); renderTable();
});

document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value; renderTable();
});

function onHeadClick(e) {
  const th = e.target.closest("th[data-k]"); if (!th) return;
  const k = th.dataset.k;
  if (state.sortKey === k) state.sortDir *= -1;
  else { state.sortKey = k; state.sortDir = k === "rank" ? 1 : -1; }
  renderTable();
}
document.getElementById("headRow1").addEventListener("click", onHeadClick);
document.getElementById("headRow2").addEventListener("click", onHeadClick);

/* 모바일: 날짜 선택 + 종목 탭 → 일별 상세 */
const daySel = document.getElementById("daySel");
daySel.innerHTML = [...DATA.dates].reverse().map(bd => `<option value="${bd}">${fdate(bd, true)}</option>`).join("");
state.day = DATA.dates[DATA.dates.length - 1];
daySel.addEventListener("change", () => { state.day = daySel.value; state.sortKey = "rank"; state.sortDir = 1; renderTable(); });
mqMobile.addEventListener("change", renderTable);

document.getElementById("body").addEventListener("click", e => {
  if (e.target.closest("a")) return;                 // 링크 클릭은 그대로 통과
  if (!mqMobile.matches) return;
  const tr = e.target.closest("tr.mrow"); if (!tr) return;
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); return; }
  document.querySelectorAll("#body tr.detail").forEach(x => x.remove());
  const st = DATA.stocks.find(s => s.code === tr.dataset.code);
  const m = state.met === "c" ? "v" : state.met;          // 투자자 열은 금액/수량
  const unit = m === "v" ? "억원" : "주";
  const mvmax = Math.max(pct95(d => d["f" + m]), pct95(d => d["o" + m]));
  const cvmax = pct95(d => d.chg);
  let rows = "";
  for (const bd of [...DATA.dates].reverse()) {
    const d = st.days[bd];
    if (!d) { rows += `<tr><td>${fdate(bd, true)}</td><td>–</td><td>–</td><td>–</td></tr>`; continue; }
    const f = d["f" + m], o = d["o" + m];
    rows += `<tr><td>${fdate(bd, true)}</td><td style="${cellTint(d.chg, cvmax)}">${fmtChg(d.chg)}</td><td style="${cellTint(f, mvmax)}">${comma(f)}</td><td style="${cellTint(o, mvmax)}">${comma(o)}</td></tr>`;
  }
  const det = document.createElement("tr");
  det.className = "detail";
  const cols = state.met === "c" ? 3 : 5;
  det.innerHTML = `<td colspan="${cols}" class="detailcell"><table class="detail-tbl">
    <tr><th>${st.name} (${unit}) · <a class="nlink" href="${naverUrl(st)}" target="_blank" rel="noopener">네이버 증권 ↗</a></th><th>등락률</th><th>외국인</th><th>기관</th></tr>${rows}</table></td>`;
  tr.after(det);
});

/* 툴팁 */
const tip = document.getElementById("tip");
document.getElementById("body").addEventListener("mousemove", e => {
  const td = e.target.closest("td[data-c]");
  if (!td) { tip.style.display = "none"; return; }
  const st = DATA.stocks.find(s => s.code === td.dataset.c);
  const d = st.days[td.dataset.d];
  tip.innerHTML = `
    <div class="t-title">${st.name} · ${fdate(td.dataset.d, true)}</div>
    <div class="t-row"><span>종가</span><span class="num">${comma(d.close)} 원</span></div>
    <div class="t-row"><span>등락률</span><span class="num">${fmtChg(d.chg)}</span></div>
    <div class="t-row"><span>외국인 순매매량</span><span class="num">${comma(d.fq)} 주</span></div>
    <div class="t-row"><span>외국인 순매매금액</span><span class="num">${comma(d.fv)} 억원</span></div>
    <div class="t-row"><span>기관 순매매량</span><span class="num">${comma(d.oq)} 주</span></div>
    <div class="t-row"><span>기관 순매매금액</span><span class="num">${comma(d.ov)} 억원</span></div>`;
  tip.style.display = "block";
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + hgt > innerHeight - 8) y = e.clientY - hgt - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.getElementById("body").addEventListener("mouseleave", () => tip.style.display = "none");

/* 테마 토글 */
document.getElementById("themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.dataset.theme = cur === "dark" ? "light" : "dark";
});

renderTiles(); renderRank(); renderTable();
</script>
</body>
</html>
