name: Update heatmap data

on:
  schedule:
    # KST 08:00~08:50 프리마켓 (UTC 전날 23시, 일~목) 10분 간격
    - cron: "*/10 23 * * 0-4"
    # KST 09:00~19:50 정규장+애프터마켓 (UTC 00:00~10:50) 평일 10분 간격
    - cron: "*/10 0-10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: update-heatmap-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch latest data
        run: python scripts/update_heatmap_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/sectors.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update heatmap data"
            git pull --rebase origin main
            git push
          fi
