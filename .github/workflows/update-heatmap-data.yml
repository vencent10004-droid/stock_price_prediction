name: Update heatmap data

on:
  schedule:
    # 정각(0분) 혼잡을 피해 2분 오프셋 사용
    # KST 08:02~08:57 프리마켓 (UTC 전날 23시, 일~목) 5분 간격
    - cron: "2-57/5 23 * * 0-4"
    # KST 09:02~19:57 정규장+애프터마켓 (UTC 00~10시) 평일 5분 간격
    - cron: "2-57/5 0-10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: update-heatmap-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch latest data
        run: python scripts/update_heatmap_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/*.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update heatmap data"
            git pull --rebase origin main
            git push
          fi
